<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Макроэкономика</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="Макроэкономика"><meta name="theme-color" content="#2b2f36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:"Times New Roman";font-style:normal;font-weight:400;src:local("Times New Roman"),local("TimesNewRomanPSMT"),url(fonts/Serif-Regular.woff) format("woff")}
@font-face{font-family:"Times New Roman";font-style:normal;font-weight:700;src:local("Times New Roman Bold"),local("TimesNewRomanPS-BoldMT"),url(fonts/Serif-Bold.woff) format("woff")}
@font-face{font-family:"Times New Roman";font-style:italic;font-weight:400;src:local("Times New Roman Italic"),local("TimesNewRomanPS-ItalicMT"),url(fonts/Serif-Italic.woff) format("woff")}
@font-face{font-family:"Times New Roman";font-style:italic;font-weight:700;src:local("Times New Roman Bold Italic"),local("TimesNewRomanPS-BoldItalicMT"),url(fonts/Serif-BoldItalic.woff) format("woff")}
@font-face{font-family:"Segoe UI";font-style:normal;font-weight:400;src:local("Segoe UI"),url(fonts/Sans-Regular.woff) format("woff")}
@font-face{font-family:"Segoe UI";font-style:normal;font-weight:700;src:local("Segoe UI Bold"),url(fonts/Sans-Bold.woff) format("woff")}

html,body{margin:0;height:100%;min-height:100dvh;overscroll-behavior:none;background:#2b2f36;overflow:hidden;font-family:"Times New Roman",Times,serif}
#wrap{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden}
html,body{overflow:hidden;width:100%}
#stage{position:absolute;width:800px;height:600px;transform-origin:0 0;background:#c0c0c0;overflow:hidden;box-shadow:0 8px 40px #0008;user-select:none}
.layer{position:absolute;left:0;top:0;width:800px;height:600px;isolation:isolate}
.layer.frames,.layer.dlgs{pointer-events:none}.layer.dlgs>*{pointer-events:auto}
.frames canvas{position:absolute;pointer-events:none}
.page{position:absolute;left:0;top:0;width:800px;height:600px;overflow:hidden}
.obj{position:absolute;box-sizing:border-box}
.para{display:flex;overflow:hidden;line-height:1.15}.ptext{width:100%}
.label{display:flex;overflow:hidden;line-height:1.1}
.clickable{cursor:pointer}
.obj.disabled{opacity:.55}
.btn{background-size:100% 100%;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center;overflow:hidden}
.btn .btxt{pointer-events:none}
.xbtn{cursor:pointer;display:flex;align-items:center;overflow:hidden}
.xbtn img,.image img{display:block}
.hotspot{cursor:pointer}
.input input,.input textarea{width:100%;height:100%;box-sizing:border-box;border:1px solid #7a7a7a;padding:1px 3px;resize:none;outline:none}
.input input:focus,.input textarea:focus{border-color:#3b7be0}
.chk{display:flex;align-items:center}.chk label{display:flex;align-items:center;gap:3px;cursor:pointer}.chk input{margin:0}
.combo select{width:100%;height:100%;box-sizing:border-box}
.grid{overflow:auto;border:1px solid #808080}
.grid table{border-collapse:collapse;width:100%}
.grid td{border:1px solid #c0c0c0;padding:1px 4px;white-space:nowrap;min-width:20px;outline:none}
.grid td.fixed{font-weight:bold;text-align:center}
.grid td:focus{background:#ffffe1}
.dback{position:absolute;left:0;top:0;width:800px;height:600px;background:#0005}
.dwin{position:absolute;background:#e9edf3;border:1px solid #3b5a86;box-shadow:0 6px 24px #0007}
.dbar{background:linear-gradient(#5b8bd0,#3b6bb5);color:#fff;font:bold 14px Tahoma,Arial,sans-serif;padding:5px 8px;display:flex;justify-content:space-between}
.dx{cursor:pointer;padding:0 4px}.dbody{position:relative}
.msgwin{left:150px;top:200px;width:500px;font-family:Tahoma,Arial,sans-serif}
.msgbody{display:flex;gap:14px;padding:16px;background:#fff;font-size:14px}
.msgicon{flex:none;width:34px;height:34px;border-radius:50%;background:#c33;color:#fff;font:bold 22px/34px Arial;text-align:center}
.msgicon.i32,.msgicon.i64{background:#2a6fd0}.msgicon.i48{background:#e0a800}.msgicon.i0{display:none}
.msgtext{white-space:pre-wrap}.msgbtns{text-align:center;padding:10px;background:#e9edf3}.msgbtns button{min-width:80px;margin:0 5px;padding:3px 12px}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
#rot{display:none;position:fixed;left:0;right:0;bottom:0;background:#1f6feb;color:#fff;font:15px/1.3 Tahoma,Arial,sans-serif;padding:10px 14px;text-align:center;z-index:9}
body.portrait #rot{display:block}
#fs{display:none;position:fixed;right:8px;top:8px;z-index:8;width:34px;height:34px;border:0;border-radius:8px;background:#0008;color:#fff;font-size:18px}
body.canfs #fs{display:block}
@media print{body{overflow:visible}}
</style></head>
<body><div id="wrap"><div id="stage"></div></div><button id="fs" title="Во весь экран">⛶</button><div id="rot" onclick="this.style.display='none'">📱 Для удобства поверните телефон горизонтально (нажмите, чтобы скрыть)</div>
<script src="project.js"></script><script src="lua.js"></script><script src="ams.js"></script><script src="api.js"></script><script src="canvas.js"></script>
<script>
AMS.start();
(function(){var b=document.getElementById('fs'),d=document.documentElement;
 var can=(d.requestFullscreen||d.webkitRequestFullscreen)&&matchMedia('(pointer:coarse)').matches&&!matchMedia('(display-mode:standalone)').matches;
 if(can){document.body.classList.add('canfs');b.onclick=function(){var f=document.fullscreenElement||document.webkitFullscreenElement;
  if(f){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d);try{screen.orientation.lock('landscape').catch(function(){})}catch(e){}}};}
 if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){var had=!!navigator.serviceWorker.controller,rl=0;
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!rl){rl=1;location.reload();}});
 navigator.serviceWorker.register('sw.js').then(function(r){if(r&&r.update)r.update();}).catch(function(){});}
})();
</script></body></html>
