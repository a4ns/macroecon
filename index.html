(function () {
  var d = document.documentElement; d.classList.remove('no-js');
  var t = null; try { t = localStorage.getItem('mx:theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  d.dataset.theme = t;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('reduce');
  var m = document.getElementById('meta-theme'); if (m) m.content = t === 'light' ? '#f2ece0' : '#07090d';
})();
</script>
